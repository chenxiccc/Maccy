name: Build Release

# 触发条件 / Trigger conditions:
# - 推送到分支：保留 artifact 90 天（GitHub 上限）
# - 推送 tag (v*)：自动创建 GitHub Release，产物永久保留
# - 手动触发
#
# Pushing to a branch keeps artifacts for 90 days (GitHub max).
# Pushing a tag (v*) creates a permanent GitHub Release with the zips attached.

on:
  push:
    branches:
      - feature/smart-preview-position
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # =========================================================================
  # 矩阵构建：Intel (x86_64) + Apple Silicon (arm64) 两个独立 .app
  # Matrix build: Intel (x86_64) + Apple Silicon (arm64) separate .app bundles
  # =========================================================================
  build:
    name: Build ${{ matrix.arch.name }}
    runs-on: macos-26
    strategy:
      matrix:
        arch:
          - name: Intel
            archs: x86_64
          - name: AppleSilicon
            archs: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # 构建 / Build
      - name: Build ${{ matrix.arch.name }} (${{ matrix.arch.archs }})
        run: |
          xcodebuild \
            -scheme Maccy \
            -configuration Release \
            -derivedDataPath build_${{ matrix.arch.archs }} \
            ARCHS="${{ matrix.arch.archs }}" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      # 打包 .app → .zip / Package .app → .zip
      - name: Package ${{ matrix.arch.name }}
        run: |
          APP_PATH="build_${{ matrix.arch.archs }}/Build/Products/Release/Maccy.app"
          ZIP_NAME="Maccy-${{ matrix.arch.name }}-${{ matrix.arch.archs }}.zip"

          # ditto 保留权限和符号链接 / ditto preserves permissions and symlinks
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_NAME"

          echo "Archive created: $ZIP_NAME"
          ls -lh "$ZIP_NAME"

      # 上传 artifact / Upload artifact
      - name: Upload ${{ matrix.arch.name }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: Maccy-${{ matrix.arch.name }}-${{ matrix.arch.archs }}
          path: Maccy-${{ matrix.arch.name }}-${{ matrix.arch.archs }}.zip
          # 90 天是 GitHub artifact 最长保留时间 / 90 days is the GitHub artifact max
          retention-days: 90

  # =========================================================================
  # Universal Binary：一次编译同时包含 arm64 + x86_64
  # Universal Binary: single build with both arm64 + x86_64
  # =========================================================================
  universal:
    name: Build Universal Binary
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Universal
        run: |
          xcodebuild \
            -scheme Maccy \
            -configuration Release \
            -derivedDataPath build_universal \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      # 验证两架构均已包含 / Verify both architectures are present
      - name: Verify Universal Binary
        run: |
          APP_PATH="build_universal/Build/Products/Release/Maccy.app"
          BINARY="$APP_PATH/Contents/MacOS/Maccy"
          echo "Architectures in binary:"
          lipo -info "$BINARY"

      - name: Package Universal
        run: |
          APP_PATH="build_universal/Build/Products/Release/Maccy.app"
          ZIP_NAME="Maccy-Universal.zip"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_NAME"
          ls -lh "$ZIP_NAME"

      - name: Upload Universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: Maccy-Universal
          path: Maccy-Universal.zip
          retention-days: 90

  # =========================================================================
  # 发布到 GitHub Release（仅 tag 推送时触发，产物永久保留）
  # Publish to GitHub Release (tag push only, artifacts stored permanently)
  # =========================================================================
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, universal]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
